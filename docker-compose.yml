version: '3.8'

services:
  # 1. База даних PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: web_lab_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: web_lab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. NestJS бекенд (MVC + REST API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: web_lab_backend
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/web_lab?schema=public"
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  pgdata: