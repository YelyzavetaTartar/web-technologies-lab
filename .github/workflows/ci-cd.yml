name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Клонування репозиторію
        uses: actions/checkout@v4

      - name: 2. Налаштування Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 3. Встановлення залежностей
        working-directory: ./backend
        run: npm ci

      - name: 4. Генерація Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: 5. Збірка TypeScript коду (Build)
        working-directory: ./backend
        run: npm run build